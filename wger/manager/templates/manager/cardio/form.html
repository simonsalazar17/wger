{% extends "base.html" %}
{% load i18n crispy_forms_tags %}

{% block title %}{% translate "Edit cardio activity" %}{% endblock %}

{% block content %}
<h1>{% translate "Edit" %} {{ log.activity }}</h1>
<div class="card">
    <div class="card-body">
        <form method="post" class="wger-form">
            {% csrf_token %}
            {% crispy form %}
            <button type="submit" class="btn btn-primary">{% translate "Save changes" %}</button>
        </form>
    </div>
</div>
<p><a href="{% url 'manager:cardio-overview' %}">{% translate "Back to cardio activities" %}</a></p>
{% endblock %}
